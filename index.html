<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">

<title>จดหมายถึงคุณ · UpPass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Mali:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{
  --up-navy:#2A3049; --up-blue:#4364E8; --up-blue-deep:#3B54B8; --up-mint:#75E2D0; --up-teal:#279DB3;
  --up-ink:#111827; --up-slate:#5B6478; --up-bg:#F7F8FC; --up-white:#FFFFFF; --up-border:#E6E9F2;
  --up-red:#D9485F; --up-mint-soft:#E3F8F4; --up-blue-soft:#EEF1FD;
  --grad:linear-gradient(135deg,#4364E8 0%,#279DB3 55%,#75E2D0 100%);
  --wash:linear-gradient(135deg,#EEF1FB 0%,#F2F0FB 40%,#E7F7F4 100%);
  --shadow:0 8px 30px rgba(42,48,73,.06);
  --font:'General Sans','IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Mali','IBM Plex Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--font);color:var(--up-ink);background:var(--up-bg);background-image:var(--wash);background-attachment:fixed;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 48px;min-height:100vh;display:flex;flex-direction:column}
.top{position:relative;display:flex;justify-content:center;align-items:center;margin-bottom:28px;min-height:36px}
.lang{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;background:#fff;border:1px solid var(--up-border);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang button{border:0;background:transparent;font:600 .75rem var(--font);letter-spacing:.04em;color:var(--up-slate);padding:.35rem .7rem;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--grad);color:#fff}
@media (max-width:380px){.top{justify-content:flex-start}}
.top img{height:30px;width:auto}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{display:inline-flex;align-items:center;gap:8px;align-self:center;background:var(--grad);color:#fff;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:.4rem .9rem;border-radius:999px}
h1{font-size:clamp(1.9rem,6.5vw,2.6rem);line-height:1.15;font-weight:700;color:var(--up-navy);text-align:center;margin:16px 0 10px;letter-spacing:-.01em}
.accent{color:var(--up-blue)}
.sub{color:var(--up-slate);text-align:center;font-size:1rem;max-width:440px;margin:0 auto}

.card{background:var(--up-white);border:1px solid var(--up-border);border-radius:20px;box-shadow:var(--shadow);padding:24px}
.public{margin-top:24px;white-space:pre-line;color:var(--up-navy);font-size:.98rem}
.public .lbl,.label{font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--up-slate);display:block;margin-bottom:8px;white-space:normal}

.form{margin-top:20px}
.form-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.form-head .t{font-weight:600;color:var(--up-navy)}
.step-pill{font-size:.72rem;font-weight:600;color:var(--up-blue);background:var(--up-blue-soft);border-radius:999px;padding:.25rem .7rem;white-space:nowrap}
.field label{display:block;font-size:.88rem;font-weight:500;color:var(--up-navy);margin-bottom:6px}
.field label .req{color:var(--up-red)}
.input{width:100%;font:600 1.15rem/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--up-navy);padding:15px 16px;border:1px solid var(--up-border);border-radius:14px;background:#FBFCFE;outline:none;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:#B4BACB;letter-spacing:.12em}
.input:focus{border-color:var(--up-blue);box-shadow:0 0 0 4px rgba(67,100,232,.12);background:#fff}
.input.err{border-color:var(--up-red);box-shadow:0 0 0 4px rgba(217,72,95,.1)}
.hint{font-size:.82rem;color:var(--up-slate);margin-top:8px}
.hint.err{color:var(--up-red)}
.btn{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;margin-top:18px;border:0;cursor:pointer;background:var(--grad);color:#fff;font:600 1rem var(--font);padding:15px 20px;border-radius:12px;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.6;cursor:default}
.btn.ghost{background:#fff;color:var(--up-blue);border:1px solid var(--up-blue)}
.secure{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--up-slate);font-size:.78rem;margin-top:14px}

/* ---------- verifying ---------- */
.cam{position:relative;width:200px;height:200px;margin:8px auto 24px}
.cam .ring{position:absolute;inset:0}
.cam .ring circle{fill:none;stroke-width:5}
.cam .ring .bg{stroke:var(--up-border)}
.cam .ring .fg{stroke:url(#g);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;stroke-dasharray:597;stroke-dashoffset:597;transition:stroke-dashoffset .8s ease}
.cam .face{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0%,#EEF1FB 70%);overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam .face svg{width:62%;height:62%;color:var(--up-blue);opacity:.75}
.cam .scan{position:absolute;left:0;right:0;height:38px;background:linear-gradient(180deg,rgba(117,226,208,0),rgba(117,226,208,.55),rgba(117,226,208,0));animation:scan 1.6s ease-in-out infinite;top:-40px}
@keyframes scan{0%{top:-40px}50%{top:calc(100% + 2px)}100%{top:-40px}}
.cam .corner{position:absolute;width:28px;height:28px;border:3px solid var(--up-mint)}
.cam .c1{top:0;left:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.cam .c2{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.cam .c3{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.cam .c4{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.cam.done .scan{display:none}
.cam.fail .ring .fg{stroke:var(--up-red)}
.checks{list-style:none;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--up-border);border-radius:14px;background:#fff;opacity:.4;transition:opacity .3s,border-color .3s,background .3s}
.checks li.run{opacity:1}
.checks li.ok{opacity:1;border-color:#CDEFE8;background:var(--up-mint-soft)}
.checks li.bad{opacity:1;border-color:#F4C9D0;background:#FDF1F3}
.checks .ic{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid var(--up-border);display:flex;align-items:center;justify-content:center;margin-top:1px}
.checks li.run .ic{border-color:var(--up-blue);border-top-color:transparent;animation:spin .8s linear infinite}
.checks li.ok .ic{background:var(--up-teal);border-color:var(--up-teal)}
.checks li.bad .ic{background:var(--up-red);border-color:var(--up-red)}
.checks .ic svg{width:14px;height:14px;color:#fff;display:none}
.checks li.ok .ic .yes,.checks li.bad .ic .no{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.checks .tt{font-weight:600;color:var(--up-navy);font-size:.92rem;line-height:1.35}
.checks .dd{font-size:.83rem;color:var(--up-slate);line-height:1.4}
.fail-box{display:none;margin-top:16px;text-align:center}
.fail-box.on{display:block}
.fail-box p{color:var(--up-slate);font-size:.92rem}

/* ---------- letter ---------- */
.app-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;margin-bottom:16px}
.app-bar .id{font-size:.78rem;color:var(--up-slate)}
.app-bar .id b{display:block;color:var(--up-navy);font-size:.95rem;letter-spacing:.02em}
.status{display:inline-flex;align-items:center;gap:6px;background:var(--up-mint-soft);color:#16806F;font-weight:600;font-size:.78rem;letter-spacing:.06em;padding:.35rem .8rem;border-radius:999px}
.status i{width:7px;height:7px;border-radius:50%;background:#1BA58F;display:block}
.letter{position:relative;padding:32px 26px 28px;overflow:hidden}
.letter:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--grad)}
.letter .to{font-family:var(--hand);font-size:1.5rem;color:var(--up-navy);margin-bottom:16px;font-weight:500}
.letter .body{font-family:var(--hand);font-size:1.08rem;line-height:1.95;color:#2B3145}
.letter .body p+p{margin-top:14px}
.letter .sign{margin-top:26px;text-align:right;font-family:var(--hand);color:var(--up-navy)}
.letter .sign b{display:block;font-size:1.3rem;font-weight:500;color:var(--up-blue)}
.letter .sign span{font-size:.85rem;color:var(--up-slate)}
.after{display:flex;gap:10px;margin-top:16px}
.after .btn{margin-top:0}
.foot{margin-top:28px;text-align:center;font-size:.78rem;color:var(--up-slate)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.confetti{display:none}}
@media (max-width:420px){.card{padding:20px}.letter{padding:28px 20px 24px}}
</style>
</head>

      ['Document check','กำลังตรวจรหัสยืนยันตัวตน…','รหัสถูกต้อง พบจดหมาย 1 ฉบับ'],
      ['Liveness detection','ตรวจว่ายังมีชีวิตอยู่…','ผ่าน ✓ ถึงจะยังไม่ได้กินกาแฟก็ตาม'],
      ['Face match','เทียบใบหน้ากับฐานข้อมูลความทรงจำ…','ตรงกัน 99.8% กับคนที่จะคิดถึง'],
      ['AML / PEP screening','คัดกรองความเสี่ยง…','ไม่พบความเสี่ยง พบแต่ความน่ารัก'],
      ['Decision flow','ประมวลผลผลลัพธ์…','APPROVED → กำลังเปิดจดหมาย']
    ]
  },
  en: {
    title:'A letter for you · UpPass', lastDay:'Last day',
    h1:'A letter is waiting for <span class="accent">identity verification</span>',
    sub:'Before you read it, a quick eKYC. Enter the code I sent you by DM and the letter written just for you will open.',
    publicLbl:'To everyone', formTitle:'Identity verification', step:'Step 1 of 1', codeLbl:'Verification code',
    hint:'This code only opens your own letter.', hintEmpty:'Please enter your full code first.',
    noCrypto:'This browser can’t open the letter. Please try a recent Chrome or Safari.',
    verify:'Verify identity', secure:'End-to-end encrypted · decrypted only on your device',
    failMsg:'We couldn’t find this code. Please check the code in your DM again (case and dashes don’t matter).',
    failStep:'Code not found · REJECTED', retry:'Try again',
    appId:'Application ID', approved:'APPROVED', to:'Dear ', sign:'With love and thanks,', lock:'Lock letter',
    foot:'Made with ♥ on the last day · Powered by (fake) UpPass eKYC', locale:'en-GB',
    steps:[
      ['Document check','Checking your verification code…','Code valid · 1 letter found'],
      ['Liveness detection','Confirming you’re alive…','Passed ✓ even before coffee'],
      ['Face match','Matching against our shared memories…','99.8% match with someone I’ll miss'],
      ['AML / PEP screening','Screening for risk…','No risk found · only good vibes'],
      ['Decision flow','Processing the result…','APPROVED → opening your letter']
    ]
  }
};
let LANG = 'th';
let OPENED = null;
const T = k => I18N[LANG][k];

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo({top:0}); }

function fmtDate(iso){
  try { return new Date(iso + 'T12:00:00').toLocaleDateString(T('locale'), {day:'numeric', month:'long', year:'numeric'}); } catch(e){ return iso; }
}

async function unlock(code){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', hash:'SHA-256', salt:b64(DATA.salt), iterations:DATA.iter},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  for (const e of DATA.entries){
    try {
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.ct));
      return JSON.parse(new TextDecoder().decode(pt).trim());
    } catch(_) { /* not this one */ }
  }
  return null;
}

function renderChecks(){
  $('checks').innerHTML = T('steps').map(s => `<li><span class="ic">${ICONS}</span><div><div class="tt">${s[0]}</div><div class="dd">${s[1]}</div></div></li>`).join('');
  return [...$('checks').children];
}
function setRing(frac){ $('ring').style.strokeDashoffset = String(597 * (1 - frac)); }

async function verify(code){
  show('s-verify');
  $('failBox').classList.remove('on');
  $('cam').className = 'cam';
  setRing(0);
  const items = renderChecks();
  const started = Date.now();
  items[0].classList.add('run');
  const result = await unlock(code).catch(() => null);
  await sleep(Math.max(0, 1100 - (Date.now() - started)));
  if (!result){
    items[0].classList.remove('run'); items[0].classList.add('bad');
    items[0].querySelector('.dd').textContent = T('failStep');
    $('cam').classList.add('fail'); setRing(1);
    $('failBox').classList.add('on');
    return;
  }
  if (result.l && result.l !== LANG) setLang(result.l);
  const steps = T('steps');
  items.forEach((li, i) => { li.querySelector('.tt').textContent = steps[i][0]; li.querySelector('.dd').textContent = steps[i][1]; });
  for (let i = 0; i < steps.length; i++){
    if (i > 0){ items[i].classList.add('run'); await sleep(850); }
    items[i].classList.remove('run'); items[i].classList.add('ok');
    items[i].querySelector('.dd').textContent = T('steps')[i][2];
    setRing((i + 1) / steps.length);
  }
  $('cam').classList.add('done');
  await sleep(700);
  openLetter(result);
}

function openLetter(r){
  OPENED = r;
  $('toName').textContent = T('to') + r.n;
  const body = $('body'); body.textContent = '';
  r.m.trim().split(/\n\s*\n/).forEach(par => {
    const p = document.createElement('p');
    par.split('\n').forEach((line, i) => { if (i) p.appendChild(document.createElement('br')); p.appendChild(document.createTextNode(line)); });
    body.appendChild(p);
  });
  $('appId').textContent = 'UP-' + DATA.lastDay.replace(/-/g, '') + '-' + String(r.i).padStart(3, '0');
  show('s-letter');
  confetti();
}

function confetti(){
  const box = $('confetti'); box.textContent = '';
  const colors = ['#4364E8','#279DB3','#75E2D0','#2A3049','#B9C6FA'];
  for (let i = 0; i < 70; i++){
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2.4 + Math.random() * 2.2 + 's';
    c.style.animationDelay = Math.random() * .6 + 's';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(c);
  }
  setTimeout(() => box.textContent = '', 5500);
}

function setLang(l){
  LANG = I18N[l] ? l : 'th';
  document.documentElement.lang = LANG;
  document.title = T('title');
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = T(el.dataset.i18n); });
  $('lastDay').textContent = fmtDate(DATA.lastDay);
  $('signDate').textContent = fmtDate(DATA.lastDay);
  const hint = $('hint'); hint.classList.remove('err');
  if (!window.crypto || !crypto.subtle){ hint.textContent = T('noCrypto'); hint.classList.add('err'); } else hint.textContent = T('hint');
  $('code').classList.remove('err');
  const pub = (DATA.publicMessage && (DATA.publicMessage[LANG] || DATA.publicMessage.th || DATA.publicMessage.en)) || '';
  $('publicText').textContent = pub; $('publicBox').hidden = !pub;
  if (OPENED) $('toName').textContent = T('to') + OPENED.n;
  // keep finished/failed check rows in the current language
  const steps = T('steps');
  [...$('checks').children].forEach((li, i) => {
    li.querySelector('.tt').textContent = steps[i][0];
    li.querySelector('.dd').textContent = li.classList.contains('bad') ? T('failStep') : (li.classList.contains('ok') ? steps[i][2] : steps[i][1]);
  });
}

function init(){
  if (!DATA){ document.body.innerHTML = '<p style="padding:40px;text-align:center">ยังไม่ได้ build — รัน <code>node build.mjs</code></p>'; return; }
  $('sender').textContent = DATA.sender;
  document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
    setLang(b.dataset.lang);
    try { localStorage.setItem('farewell-lang', b.dataset.lang); } catch(_) {}
  }));
  let saved = null; try { saved = localStorage.getItem('farewell-lang'); } catch(_) {}
  setLang(saved === 'en' ? 'en' : 'th');

  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('code').value;
    if (norm(v).length < 6){
      $('code').classList.add('err'); $('hint').classList.add('err');
      $('hint').textContent = T('hintEmpty'); $('code').focus(); return;
    }
    verify(v);
  });
  $('code').addEventListener('input', () => {
    $('code').classList.remove('err'); $('hint').classList.remove('err');
    $('hint').textContent = T('hint');
  });
  $('retry').addEventListener('click', () => { show('s-start'); $('code').select(); });
  $('lock').addEventListener('click', () => { OPENED = null; $('body').textContent = ''; $('toName').textContent = ''; $('code').value = ''; show('s-start'); });
}
init();
</script>
</body>
